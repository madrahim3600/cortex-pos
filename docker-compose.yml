version: '3.8'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: cortex_db
      POSTGRES_USER: cortex_user
      POSTGRES_PASSWORD: cortex_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: always

  backend:
    build: ./cortex/backend
    ports:
      - "8000:8000"
    env_file: .env
    depends_on:
      - db
    volumes:
      - ./cortex/backend:/app
    restart: always

  bot:
    build: ./cortex/bot
    env_file: .env
    depends_on:
      - backend
    volumes:
      - ./cortex/bot:/app
    restart: always

volumes:
  postgres_data:
